# File: docker-compose.yml
# Purpose: Run PostgreSQL 19, TypeScript API, and Frontend on a dedicated internal network.

services:
  postgres:
    image: postgres:19-alpine
    container_name: app-postgres
    environment:
      POSTGRES_DB: app_db
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d app_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-net

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: app-api
    environment:
      NODE_ENV: development
      PORT: "3000"
      DATABASE_URL: "postgresql://app_user:app_password@postgres:5432/app_db"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    networks:
      - app-net

  frontend:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: app-frontend
    environment:
      NODE_ENV: development
      API_BASE_URL: "http://api:3000"
    depends_on:
      - api
    ports:
      - "5173:5173"
    networks:
      - app-net

volumes:
  pgdata:

networks:
  app-net:
    driver: bridge

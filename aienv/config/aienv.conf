# ── aienv shared configuration - COMMITTABLE (no secrets here) ────────────────
# Secrets (tokens, setup keys, SSH key) go in config/aienv.secrets (gitignored)
# or in each project's private .env. Precedence:
#   <project>/.env  >  <project>/aienv.config  >  config/aienv.secrets  >  this file

# Where projects are created (empty = <toolkit>/projects)
projects_dir=

# Ollama AI server on your NetBird mesh, by MagicDNS name of the AI host.
# This is what makes the AI reachable from EVERY machine in the mesh - change
# the hostname to the peer that runs Ollama in your network.
AI_SERVER_URL=http://desk01.netbird.selfhosted:11434

# Models exposed to pi (first entry is the default). Pull them on the AI server
# with: ollama pull <model>
AI_MODELS=qwen2.5-coder:3b qwen2.5-coder:7b

# Your self-hosted NetBird management URL (can be overridden per project)
NB_MANAGEMENT_URL=

# Base image for aienv-base. node:lts-bookworm always tracks the latest stable
# Node LTS; pin a version (e.g. node:24-bookworm) only if you must.
NODE_IMAGE=node:lts-bookworm

# Timezone inside environments
TZ=Europe/Rome

# Dev-server ports exposed for browser preview (Next 3000, Vite 5173, generic 8080)
PREVIEW_PORTS=3000 5173 8080

# Default resources per environment
MEM_LIMIT=4g
CPU_LIMIT=2.0
PIDS_LIMIT=512

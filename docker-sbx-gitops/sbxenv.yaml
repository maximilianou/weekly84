# =============================================================================
# sbxenv.yaml -- declarative Docker Sandbox environment (GitOps core file)
#
# IMPORTANT: sbx resolves EVERY relative path in this file (kits, workspace,
# mounts) from the directory CONTAINING THIS FILE -- not from the directory
# you run sbx in. That is why this file lives at the repo root, next to
# ./kit/devstack and ./workspaces. (Keeping it in a subdirectory, e.g. env/,
# makes sbx look for kit/devstack INSIDE that subdirectory -- the classic
# "error: resolve kits: kit path .../env/kit/devstack does not exist".)
#
# Docs: https://docs.docker.com/ai/sandboxes/configuration/environment-files/
# Usage (from the repo root, or pass this file's path):
#   sbx env plan   sbxenv.yaml --name devstack
#   sbx env create sbxenv.yaml --name devstack
#   sbx env exec   sbxenv.yaml -- <command>
#   sbx env rm     sbxenv.yaml --name devstack
#
# NOTE: values below must stay in sync with etc.env (SBX_NAME, ports,
# POSTGRES_*, *_PORT). ./sbx.sh check verifies the sync; `./sbx.sh up`
# pushes the etc.env values into the sandbox before bootstrap runs.
# =============================================================================

schemaVersion: "1"

# Sandbox name -- the committed default. ./sbx.sh up --name weekly85 (or
# SBX_NAME in etc.env) overrides it for that run; the per-project resources
# (postgres volume, internal network, default GitHub repo) follow the
# effective name. See README "Project name".
name: devstack

# The agent workload this environment attaches to. For a local kit, `agent`
# is the kit's repository name (kit directory: kit/devstack).
agent: devstack

# Primary workspace mounted into the sandbox (relative to this file).
workspace: ./workspaces

kits:
  # Local kit directory -- sbx builds it with the sandbox-kit frontend
  # (devstack.yaml + devstack.dockerfile, same basename).
  - ./kit/devstack

# Fallback environment injected into the sandbox. `./sbx.sh up` overwrites
# these with the authoritative etc.env values (written to
# /etc/sandbox-persistent.sh) before the bootstrap script runs.
env:
  NODE_ENV: development
  AI_PROVIDER: ollama
  AI_OLLAMA_URL: http://host.docker.internal:11434
  AI_OLLAMA_MODEL: qwen2.5-coder:7b
  AI_MODEL_RUNNER_URL: http://model-runner.docker.internal/engines/v1
  # SBX_NET_NAME / PGDATA_VOLUME are name-derived at runtime
  # (<name>-net / <name>-pgdata) -- do not pin them here.
  POSTGRES_IMAGE: postgres:16-alpine
  POSTGRES_USER: dev
  POSTGRES_PASSWORD: dev-password-change-me
  POSTGRES_DB: appdb
  POSTGRES_HOST: pg-dev
  PG_PORT: "5432"
  ADMINER_IMAGE: adminer:4
  ADMINER_DEFAULT_SERVER: pg-dev
  ADMINER_PORT: "8081"
  API_PORT: "4000"
  WEB_PORT: "5173"
  VITE_API_BASE: /api

# Host <- sandbox published ports. hostIP defaults to loopback (127.0.0.1),
# which is what you want for a dev environment. Keep in sync with
# PG_PORT / API_PORT / WEB_PORT / ADMINER_PORT in etc.env.
ports:
  - sandbox: 4000
    host: 4000
  - sandbox: 5173
    host: 5173
  - sandbox: 8081
    host: 8081
  - sandbox: 5432
    host: 5432

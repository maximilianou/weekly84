# =============================================================================
# docker-compose.yaml -- standalone run of the APP stack (no sbx / pi / herdr)
#
# Three layers, one source of truth:
#   kit/ + sbx.sh + sbxenv.yaml   -> the AI dev environment (pi, herdr, ollama)
#   workspaces/{api,web}          -> THE APP (mounted by sbx AND bind-mounted here)
#   this file                     -> plain docker runtime everybody can run
#
#   docker compose --env-file etc.env up -d      # etc.env supplies ports/creds
#   docker compose up -d                         # works too: defaults below
#
# Port clash: the sbx sandbox publishes the SAME host ports while it runs.
# ./sbx.sh down first, or change the ports in etc.env.
#
# SWAPPING THE STACK (TypeScript -> Rust tomorrow): only the `api` service
# below and workspaces/api change. The kit (pi/herdr/ollama), the sandbox
# bootstrap and the web service stay untouched.
# =============================================================================

services:
  # -- Database ----------------------------------------------------------------
  pg-dev:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: pg-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-password-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dev} -d ${POSTGRES_DB:-appdb}"]
      interval: 2s
      timeout: 3s
      retries: 30

  # -- Database admin ------------------------------------------------------------
  adminer-dev:
    image: ${ADMINER_IMAGE:-adminer:4}
    container_name: adminer-dev
    restart: unless-stopped
    depends_on:
      pg-dev:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: pg-dev
    ports:
      - "${ADMINER_PORT:-8081}:8080"

  # -- APP: backend (swap THIS service to change the language) -------------------
  api:
    image: node:26-alpine
    container_name: api-dev
    working_dir: /app
    restart: unless-stopped
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      API_PORT: ${API_PORT:-4000}
      DATABASE_URL: postgres://${POSTGRES_USER:-dev}:${POSTGRES_PASSWORD:-dev-password-change-me}@pg-dev:5432/${POSTGRES_DB:-appdb}
      DATABASE_URL_INTERNAL: postgres://${POSTGRES_USER:-dev}:${POSTGRES_PASSWORD:-dev-password-change-me}@pg-dev:5432/${POSTGRES_DB:-appdb}
    ports:
      - "${API_PORT:-4000}:${API_PORT:-4000}"
    volumes:
      - ./workspaces/api:/app
      - api_deps:/app/node_modules
    depends_on:
      pg-dev:
        condition: service_healthy

  # -- APP: frontend (vite dev server proxies /api -> http://api:$API_PORT) ------
  web:
    image: node:26-alpine
    container_name: web-dev
    working_dir: /app
    restart: unless-stopped
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    environment:
      WEB_PORT: ${WEB_PORT:-5173}
      API_PORT: ${API_PORT:-4000}
      API_HOST: api
      VITE_API_BASE: ${VITE_API_BASE:-/api}
    ports:
      - "${WEB_PORT:-5173}:${WEB_PORT:-5173}"
    volumes:
      - ./workspaces/web:/app
      - web_deps:/app/node_modules
    depends_on:
      - api

volumes:
  pgdata:
    name: ${PGDATA_VOLUME:-devstack-pgdata}
  api_deps:
  web_deps:
